<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Сторінку не знайдено — Генератори завдань</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #2b2a26;
      --muted: #6d6a61;
      --accent: #2f6b4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans", system-ui, -apple-system, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 460px;
      padding: 32px;
      border: 1px solid #dcd6c9;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(43, 42, 38, 0.08);
      text-align: center;
    }
    .code {
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }
    h1 {
      margin: 12px 0 8px;
      font-size: 24px;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    a {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #285b43; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, адресу змінено або сторінку видалено.</p>
    <a href="/" data-home>На головну</a>
  </main>
  <script>
    if (location.protocol === "file:") {
      document.querySelector("[data-home]").setAttribute("href", "index.html");
    }
  </script>
</body>
</html>
